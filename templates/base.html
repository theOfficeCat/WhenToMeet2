<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}WhenToMeet 2{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">WhenToMeet <span>2</span></a>
    <span class="muted small">Sí = 2 · Quizás = 1 · No = 0</span>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">Hecho para coordinar sin adivinar disponibilidad.</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
