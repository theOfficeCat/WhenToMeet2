{% extends "base.html" %}
{% block title %}Create event · WhenToMeet 2{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Create an event</h1>
  <p class="muted">Pick dates and times, create the event and share the link with the group.</p>

  {% if error %}<div class="alert">{{ error }}</div>{% endif %}

  <form method="post" action="{{ url_for('create_event') }}" class="form">
    <label>Event name
      <input name="name" maxlength="120" required value="{{ form.name }}" placeholder="Team meeting">
    </label>

    <label>Description (optional)
      <textarea name="description" maxlength="500" rows="2" placeholder="What is it about?">{{ form.description }}</textarea>
    </label>

    <div class="row">
      <label>From
        <input type="date" name="start_date" required value="{{ form.start_date }}">
      </label>
      <label>To
        <input type="date" name="end_date" required value="{{ form.end_date }}">
      </label>
    </div>

    <div class="row">
      <label>Start time
        <select name="start_hour">
          {% for h in range(0, 24) %}
          <option value="{{ h }}" {% if h == form.start_hour %}selected{% endif %}>{{ '%02d:00'|format(h) }}</option>
          {% endfor %}
        </select>
      </label>
      <label>End time
        <select name="end_hour">
          {% for h in range(1, 25) %}
          <option value="{{ h }}" {% if h == form.end_hour %}selected{% endif %}>{{ '%02d:00'|format(h) }}</option>
          {% endfor %}
        </select>
      </label>
      <label>Slot duration
        <select name="slot_minutes">
          {% for m in slot_options %}
          <option value="{{ m }}" {% if m == form.slot_minutes %}selected{% endif %}>{{ m }} min</option>
          {% endfor %}
        </select>
      </label>
    </div>

    <div>
      <button class="btn primary" type="submit">Create event</button>
    </div>
  </form>
</section>
{% endblock %}
