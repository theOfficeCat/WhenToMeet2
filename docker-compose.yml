services:
  whentomeet:
    image: ghcr.io/theofficecat/whentomeet2:latest
    build: .
    pull_policy: missing
    container_name: whentomeet2
    ports:
      - "5000:5000"
    environment:
      DB_PATH: /data/whentomeet.db
    volumes:
      - whentomeet-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  whentomeet-data:
